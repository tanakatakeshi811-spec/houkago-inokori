<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1420">
<title>放課後の居残り</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* 配色・フォントは新・放課後の居残り(new/index.html)のタイトル画面と同じ */
:root{color-scheme:dark;--chalk:#f4f1e6;--board:#21392c;--board2:#172a20;--red:#d8403a;--red2:#a82822;--sun:#ffb070;--gold:#f2c14e;--ui:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo","Noto Sans CJK JP",sans-serif;--head:"Dela Gothic One","Hiragino Kaku Gothic StdN","Yu Gothic","Meiryo","Noto Sans CJK JP",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#120e16;color:var(--chalk);font-family:var(--ui);-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#3a2433,#120e16 70%);display:flex;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
.wrap{width:100%;max-width:680px;text-align:center}
.sub{letter-spacing:.5em;font-size:12px;opacity:.75;margin:14px 0 6px}
h1{font-family:var(--head);font-weight:400;font-size:clamp(40px,10vw,76px);margin:0;line-height:1.05;text-shadow:0 4px 0 #1a0f14,0 0 30px rgba(255,120,80,.35);letter-spacing:.04em}
h1 span{color:#ff5a4a;display:inline-block;transform:rotate(-3deg);text-shadow:0 4px 0 #3a0a08,0 0 24px rgba(255,60,40,.5)}
.tag{margin:10px 0 22px;font-size:clamp(13px,2.4vw,16px);opacity:.85}
a{color:inherit;text-decoration:none}
/* 新: いちばん目立つ大ボタン */
.hero{position:relative;display:block;padding:26px 20px 22px;border-radius:18px;background:linear-gradient(160deg,#e24d44,var(--red2));border:3px solid #ffd9c9;box-shadow:0 6px 0 #5a120e,0 0 36px rgba(255,80,60,.55);animation:pulse 2.2s ease-in-out infinite}
.hero:active{transform:translateY(4px);box-shadow:0 2px 0 #5a120e,0 0 24px rgba(255,80,60,.5)}
.hero .badge{position:absolute;top:-14px;left:16px;background:var(--gold);color:#3a2a00;font-family:var(--head);font-size:15px;padding:3px 14px;border-radius:99px;transform:rotate(-4deg);box-shadow:0 2px 0 #7a5a00}
.hero b{display:block;font-family:var(--head);font-weight:400;font-size:clamp(26px,6.4vw,40px);letter-spacing:.04em;text-shadow:0 3px 0 #3a0a08}
.hero small{display:block;margin-top:6px;font-size:clamp(13px,2.8vw,16px);opacity:.95}
@keyframes pulse{50%{box-shadow:0 6px 0 #5a120e,0 0 52px rgba(255,110,80,.85)}}
@media (prefers-reduced-motion:reduce){.hero{animation:none}}
/* 旧: 黒板パネルの中にモード選択 */
.old{margin-top:26px;padding:18px 14px 16px;border-radius:16px;background:linear-gradient(180deg,var(--board),var(--board2));border:3px solid #6b4a2b;box-shadow:inset 0 0 30px rgba(0,0,0,.4)}
.old h2{margin:0 0 4px;font-family:var(--head);font-weight:400;font-size:20px;letter-spacing:.06em}
.old p{margin:0 0 14px;font-size:13px;opacity:.75}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m{display:flex;flex-direction:column;justify-content:center;min-height:84px;padding:12px 8px;border-radius:12px;background:#ffffff14;border:2px solid #f4f1e655;transition:background .15s}
.m:hover{background:#ffffff26}
.m:active{transform:translateY(2px);background:#ffffff33}
.m b{font-size:clamp(17px,4.4vw,21px);font-weight:900}
.m small{margin-top:3px;font-size:12px;opacity:.8}
.m.net{grid-column:1/-1;background:#1d4a6e66;border-color:#7cc4ff99}
.foot{margin:20px 0 4px;font-size:12px;opacity:.55}
@media (max-width:360px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
  <div class="sub">HOUKAGO NO INOKORI</div>
  <h1>放課後の<span>居残り</span></h1>
  <div class="tag">遊ぶバージョンを選んでね</div>

  <a class="hero" id="goNew" href="new/">
    <span class="badge">NEW</span>
    <b>新・放課後の居残り</b>
    <small>先生1人 vs 生徒4人｜生徒でも先生でも遊べる、軽くて新しい放課後鬼ごっこ</small>
  </a>

  <section class="old">
    <h2>旧・放課後の居残り</h2>
    <p>これまでのバージョン。モードを選んですぐ遊べます</p>
    <div class="grid">
      <a class="m" href="classic/?mode=classic"><b>通常</b><small>先生1 vs 生徒4</small></a>
      <a class="m" href="classic/?mode=classic2"><b>2 vs 8</b><small>先生2 vs 生徒8</small></a>
      <a class="m" href="classic/?mode=event"><b>怪異退治</b><small>追跡者1 vs 生徒最大7</small></a>
      <a class="m" href="classic/"><b>ぜんぶ見る</b><small>キャラ・武器・ランキング</small></a>
      <a class="m net" href="classic/?mode=online"><b>🌐 オンライン対戦</b><small>部屋コードで友達と一緒に遊ぶ</small></a>
    </div>
  </section>
  <div class="foot">キーボード＋マウス ／ タッチ ／ ゲームパッド対応</div>
</main>
<script>
/* 旧ゲームの招待URL(?r=コード)は今まで通りオンライン画面へ案内する */
(function(){
  try{
    var r=new URLSearchParams(location.search).get('r');
    if(r) location.replace('classic/?r='+encodeURIComponent(r));
  }catch(e){}
})();
</script>
</body>
</html>
